<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weave Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Weave <span>local three-replica demo</span></h1>
      <p class="intro">
        Three editors, each with its own CRDT replica, connected by a simulated network that
        delays and reorders messages. Take one offline, edit on both sides, then reconnect.
      </p>
      <div class="controls">
        <label>
          Network latency
          <input id="latency" type="range" min="0" max="3000" step="50" value="300" />
          <output id="latency-value"></output>
        </label>
        <div id="convergence" class="badge"></div>
        <div id="network-stats" class="stats"></div>
      </div>
    </header>
    <main id="peers"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
